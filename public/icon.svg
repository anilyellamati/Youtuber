<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FF3D3D"/>
      <stop offset="0.55" stop-color="#E0115F"/>
      <stop offset="1" stop-color="#6A1BFF"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1B1430"/>
      <stop offset="1" stop-color="#0B0716"/>
    </linearGradient>
    <linearGradient id="play" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#FFD9E6"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000" flood-opacity="0.35"/>
    </filter>
    <clipPath id="cam"><circle cx="736" cy="704" r="128"/></clipPath>
  </defs>
  <!-- squircle tile -->
  <rect x="64" y="64" width="896" height="896" rx="208" fill="url(#bg)"/>
  <rect x="64" y="64" width="896" height="448" rx="208" fill="#fff" opacity="0.06"/>
  <!-- game screen -->
  <g filter="url(#shadow)">
    <rect x="176" y="232" width="672" height="452" rx="64" fill="url(#screen)"/>
    <path d="M436 362 L436 554 L604 458 Z" fill="url(#play)" stroke="url(#play)" stroke-width="28" stroke-linejoin="round"/>
  </g>
  <!-- REC dot -->
  <circle cx="252" cy="300" r="26" fill="#FF3D3D"/>
  <circle cx="252" cy="300" r="40" fill="none" stroke="#FF3D3D" stroke-width="8" opacity="0.45"/>
  <!-- facecam bubble -->
  <g filter="url(#shadow)">
    <circle cx="736" cy="704" r="148" fill="#fff"/>
    <g clip-path="url(#cam)">
      <rect x="600" y="568" width="272" height="272" fill="#2A1E4A"/>
      <path d="M612 860 C624 770 848 770 860 860 Z" fill="#FFB86B"/>
      <circle cx="736" cy="676" r="58" fill="#FFB86B"/>
      <path d="M664 676 A72 72 0 0 1 808 676" fill="none" stroke="#FF3D6E" stroke-width="18" stroke-linecap="round"/>
      <rect x="650" y="652" width="30" height="58" rx="14" fill="#FF3D6E"/>
      <rect x="792" y="652" width="30" height="58" rx="14" fill="#FF3D6E"/>
      <path d="M668 704 C676 744 704 752 728 748" fill="none" stroke="#FF3D6E" stroke-width="10" stroke-linecap="round"/>
      <circle cx="732" cy="748" r="10" fill="#FF3D6E"/>
    </g>
  </g>
</svg>
