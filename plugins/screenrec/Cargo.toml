[package]
name = "tauri-plugin-screenrec"
version = "0.1.0"
edition = "2021"
links = "tauri-plugin-screenrec"
description = "Mobile screen recording with a facecam bubble (Android MediaProjection)"

[dependencies]
tauri = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }
