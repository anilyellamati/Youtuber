[package]
name = "streamforge"
version = "1.0.2"
description = "StreamForge - record, edit and publish gaming videos to YouTube"
edition = "2021"
rust-version = "1.77"

[lib]
name = "streamforge_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-util", "fs", "process", "sync", "time"] }
tokio-util = { version = "0.7", features = ["io"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
futures-util = "0.3"
base64 = "0.22"
sha2 = "0.10"
rand = "0.8"
url = "2"
dirs = "5"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-global-shortcut = "2"

[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
tauri-plugin-screenrec = { path = "../plugins/screenrec" }

[profile.release]
# Small, fast binaries for low-spec machines.
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
