name: StreamForge Lite (Windows)

# Recorder-only Windows edition. Builds x64 + x86 installers, launches the x64
# app on the runner and captures a screenshot of the running window.
on:
  push:
    tags: ["lite-v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        target: [x86_64-pc-windows-msvc, i686-pc-windows-msvc]
    name: Lite ${{ matrix.target }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: lite-${{ matrix.target }}
      - run: npm ci

      - name: Build installer
        run: npx tauri build --target ${{ matrix.target }} --bundles nsis --config src-tauri/tauri.lite.conf.json -- --no-default-features

      - name: Collect files
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out | Out-Null
          $setup = Get-ChildItem "src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe" | Select-Object -First 1
          Copy-Item $setup.FullName out/
          $exe = "src-tauri/target/${{ matrix.target }}/release/StreamForgeLite.exe"
          "Installer: {0:N1} MB" -f ($setup.Length / 1MB)
          "App exe:   {0:N1} MB" -f ((Get-Item $exe).Length / 1MB)

      - name: Launch app and take screenshot
        if: matrix.target == 'x86_64-pc-windows-msvc'
        shell: pwsh
        run: |
          $exe = Resolve-Path "src-tauri/target/${{ matrix.target }}/release/StreamForgeLite.exe"
          $p = Start-Process -FilePath $exe -PassThru
          Start-Sleep -Seconds 15
          "Running: $(-not $p.HasExited)  Memory: {0:N0} MB" -f ($p.WorkingSet64 / 1MB)
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
          $g = [System.Drawing.Graphics]::FromImage($bmp)
          $g.CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
          $bmp.Save("out/StreamForgeLite-windows-screenshot.png", [System.Drawing.Imaging.ImageFormat]::Png)
          Get-Process | Where-Object { $_.ProcessName -match 'StreamForgeLite|msedgewebview2' } | Measure-Object WorkingSet64 -Sum | ForEach-Object { "App + WebView2 memory: {0:N0} MB" -f ($_.Sum / 1MB) }
          Stop-Process -Id $p.Id -Force

      - uses: actions/upload-artifact@v4
        with:
          name: StreamForgeLite-${{ matrix.target }}
          path: out/*

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.ref_name }}"
          # both matrix jobs may race to create the release; either one winning is fine
          gh release view "$TAG" > /dev/null 2>&1 || gh release create "$TAG" --title "StreamForge Lite ${TAG#lite-v}" \
            --notes "Lightweight Windows recorder: screen/window + camera + mic + computer sound, with live video filters." || true
          gh release upload "$TAG" out/* --clobber
