name: Build StreamForge

# Builds every target on push to main / tags, and publishes installers to a
# GitHub release for tags like v1.2.3.
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      only:
        description: "Which builds to run"
        type: choice
        options: [all, desktop, android]
        default: all
      release_tag:
        description: "Attach outputs to this existing release tag (optional)"
        default: ""

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  SF_GOOGLE_CLIENT_ID: ${{ secrets.SF_GOOGLE_CLIENT_ID }}
  SF_GOOGLE_CLIENT_SECRET: ${{ secrets.SF_GOOGLE_CLIENT_SECRET }}

jobs:
  desktop:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.only != 'android' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: "Windows x64", os: windows-latest, target: x86_64-pc-windows-msvc, bundles: "nsis,msi" }
          - { name: "Windows x86 (32-bit)", os: windows-latest, target: i686-pc-windows-msvc, bundles: "nsis" }
          - { name: "macOS Apple Silicon", os: macos-14, target: aarch64-apple-darwin, bundles: "app,dmg" }
          - { name: "macOS Intel", os: macos-15-intel, target: x86_64-apple-darwin, bundles: "app,dmg" }
          - { name: "Linux x64", os: ubuntu-22.04, target: x86_64-unknown-linux-gnu, bundles: "deb,appimage" }
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: ${{ matrix.target }}

      - name: Linux system packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - run: npm ci

      - name: Fetch static FFmpeg sidecar
        shell: bash
        env:
          FFMPEG_URL_I686: ${{ vars.FFMPEG_URL_I686 }}
        run: node scripts/fetch-ffmpeg.mjs ${{ matrix.target }}

      - name: Configure sidecar
        id: sidecar
        shell: bash
        run: |
          if ls src-tauri/bin/ffmpeg-${{ matrix.target }}* >/dev/null 2>&1; then
            echo 'config={"bundle":{"externalBin":["bin/ffmpeg"]}}' >> "$GITHUB_OUTPUT"
          else
            echo 'config={}' >> "$GITHUB_OUTPUT"
          fi

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # For signed + notarized macOS builds add APPLE_CERTIFICATE,
          # APPLE_CERTIFICATE_PASSWORD, APPLE_SIGNING_IDENTITY, APPLE_ID,
          # APPLE_PASSWORD and APPLE_TEAM_ID here (empty values break the build).
        with:
          args: --target ${{ matrix.target }} --bundles ${{ matrix.bundles }} --config '${{ steps.sidecar.outputs.config }}'
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          releaseName: StreamForge ${{ github.ref_name }}
          releaseDraft: false

      - uses: actions/upload-artifact@v4
        with:
          name: StreamForge-${{ matrix.target }}
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.exe
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.msi
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.dmg
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.deb
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.AppImage

  android:
    name: Android (APK)
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.only != 'desktop' }}
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Install NDK (runner ships the Android SDK)
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          yes | "$SDKM" --install "ndk;27.0.12077973" "platforms;android-36" "build-tools;36.0.0" > /dev/null
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: android
      - run: npm ci
      - name: Build
        run: |
          export NDK_HOME="$ANDROID_HOME/ndk/27.0.12077973"
          ls "$NDK_HOME/toolchains" > /dev/null
          npx tauri android init --ci
          npx tauri android build --apk --ci
      - name: Sign APK
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          # Uses your keystore when the secrets are set; otherwise a throwaway test key
          # (fine for sideloading, not for Play Store updates).
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > release.jks
            PASS="$KEYSTORE_PASSWORD"
          else
            PASS=streamforge
            keytool -genkeypair -v -keystore release.jks -alias streamforge -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "$PASS" -keypass "$PASS" -dname "CN=StreamForge"
          fi
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          APK=$(find src-tauri/gen/android/app/build/outputs/apk -name '*release*.apk' | head -1)
          mkdir -p out
          "$BT/zipalign" -f 4 "$APK" out/aligned.apk
          "$BT/apksigner" sign --ks release.jks --ks-pass "pass:$PASS" --out out/StreamForge-android.apk out/aligned.apk
          rm out/aligned.apk
      - uses: actions/upload-artifact@v4
        with:
          name: StreamForge-android
          path: out/StreamForge-android.apk
      - name: Attach to release
        if: ${{ startsWith(github.ref, 'refs/tags/') || inputs.release_tag != '' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          VER="${TAG#v}"
          cp out/StreamForge-android.apk "out/StreamForge_${VER}_android.apk"
          # the desktop jobs create the release; wait for it if Android finishes first
          for i in $(seq 1 30); do gh release view "$TAG" > /dev/null 2>&1 && break; sleep 30; done
          gh release upload "$TAG" "out/StreamForge_${VER}_android.apk" --clobber

  ios:
    name: iOS (needs signing secrets)
    runs-on: macos-14
    if: ${{ vars.IOS_ENABLED == 'true' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim
      - run: npm ci
      - name: Build
        env:
          APPLE_DEVELOPMENT_TEAM: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_PATH: ${{ runner.temp }}/AuthKey.p8
        run: |
          echo "${{ secrets.APPLE_API_KEY_P8 }}" > "$APPLE_API_KEY_PATH"
          npx tauri ios init --ci
          npx tauri ios build --export-method app-store-connect --ci
      - uses: actions/upload-artifact@v4
        with:
          name: StreamForge-ios
          path: src-tauri/gen/apple/build/**/*.ipa
