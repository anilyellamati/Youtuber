[package]
name = "streamforge-rec"
version = "1.0.1"
edition = "2021"
description = "StreamForge Rec - strict, lightweight screen recorder"

[[bin]]
name = "StreamForgeRec"
path = "src/main.rs"

[dependencies]
cpal = "0.15"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
dirs = "5"
fs2 = "0.4"

[target.'cfg(windows)'.dependencies]
native-windows-gui = { version = "1.0", default-features = false, features = ["progress-bar", "animation-timer", "combobox"] }
winapi = { version = "0.3", features = ["winuser", "windef", "minwindef"] }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
